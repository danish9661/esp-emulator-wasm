<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP-EMU — RISC-V Emulator for ESP32-C3/C6</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: #16213e;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #0f3460;
            flex-shrink: 0;
        }
        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #e94560;
            white-space: nowrap;
        }
        header h1 span { color: #e0e0e0; font-weight: 400; font-size: 14px; }
        .controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }
        select, button, input[type="file"] {
            background: #0f3460;
            color: #e0e0e0;
            border: 1px solid #533483;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }
        button:hover { background: #533483; }
        button:disabled { opacity: 0.4; cursor: default; }
        button.primary { background: #e94560; border-color: #e94560; color: #fff; }
        button.primary:hover { background: #c73450; }
        .status-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        .status-bar #status-text {
            min-width: 60px;
            text-align: center;
        }
        .status-bar .mips {
            color: #4ecca3;
            font-weight: 600;
            font-family: 'Menlo', 'Consolas', monospace;
            min-width: 80px;
            text-align: right;
        }
        .status-bar #cycle-display {
            font-family: 'Menlo', 'Consolas', monospace;
            min-width: 120px;
            text-align: right;
        }
        .main-area {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .left-panel {
            width: 200px;
            background: #16213e;
            border-right: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .left-panel .panel-section {
            padding: 10px 12px;
            border-bottom: 1px solid #0f3460;
        }
        .left-panel .panel-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 8px;
        }
        .config-field {
            margin-bottom: 8px;
        }
        .config-field:last-child {
            margin-bottom: 0;
        }
        .config-field label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
        }
        .config-field select,
        .config-field button,
        .config-field input[type="text"] {
            width: 100%;
            font-size: 12px;
        }
        .config-field input[type="text"] {
            background: #0a0a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            padding: 5px 8px;
            border-radius: 4px;
        }
        .file-upload {
            position: relative;
            overflow: hidden;
            display: block;
        }
        .file-upload button {
            width: 100%;
            text-align: left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .file-upload input[type="file"] {
            position: absolute;
            left: 0; top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
        .terminal-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 8px;
            min-width: 0;
        }
        .terminal-panel h2 {
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 4px;
        }
        #terminal-container {
            flex: 1;
            background: #000;
            border-radius: 4px;
            overflow: hidden;
            padding-bottom: 4px;
        }
        .side-panel {
            width: 320px;
            background: #16213e;
            border-left: 1px solid #0f3460;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }
        .panel-section {
            padding: 8px 12px;
            border-bottom: 1px solid #0f3460;
        }
        .panel-section h3 {
            font-size: 11px;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 6px;
        }
        .gpio-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
        }
        .gpio-pin {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 9px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .gpio-pin.high { background: #4ecca3; border-color: #4ecca3; color: #000; }
        .gpio-pin.low { background: #333; border-color: #555; }
        .reg-table {
            font-family: 'Menlo', 'Consolas', monospace;
            font-size: 11px;
            width: 100%;
        }
        .reg-table td { padding: 1px 4px; }
        .reg-table .name { color: #888; }
        .reg-table .val { color: #4ecca3; }
        footer {
            background: #16213e;
            padding: 4px 16px;
            font-size: 11px;
            color: #555;
            border-top: 1px solid #0f3460;
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <header>
        <h1>ESP-EMU <span>v0.39.0</span></h1>
        <div class="controls">
            <button id="run-btn" class="primary" disabled>&#9654; Run</button>
            <button id="pause-btn" disabled>&#9646;&#9646; Pause</button>
            <button id="step-btn" disabled>&#9197; Step</button>
            <button id="reset-btn" disabled>&#8635; Reset</button>
        </div>
        <div class="status-bar">
            <span id="status-text">No firmware loaded</span>
            <span class="mips" id="mips-display">0.0 MIPS</span>
            <span id="cycle-display">0 cycles</span>
        </div>
    </header>

    <div class="main-area">
        <div class="left-panel">
            <div class="panel-section">
                <h3>Target</h3>
                <div class="config-field">
                    <label>Chip</label>
                    <select id="chip-select">
                        <option value="esp32c3">ESP32-C3</option>
                        <option value="esp32c6">ESP32-C6</option>
                        <option value="esp32h2">ESP32-H2</option>
                        <option value="esp32p4">ESP32-P4</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>ROM ELF (optional)</label>
                    <div class="file-upload">
                        <button id="rom-btn">Override ROM...</button>
                        <input type="file" id="rom-file" accept=".elf">
                    </div>
                </div>
                <div class="config-field">
                    <label>Firmware</label>
                    <div class="file-upload">
                        <button id="upload-btn">Load .bin...</button>
                        <input type="file" id="firmware-file" accept=".bin">
                    </div>
                </div>
            </div>
            <div class="panel-section">
                <h3>WiFi</h3>
                <div class="config-field">
                    <label>SSID</label>
                    <input type="text" id="wifi-ssid" value="myssid" placeholder="WiFi SSID">
                </div>
                <div class="config-field">
                    <label>Password</label>
                    <input type="text" id="wifi-password" value="mypassword" placeholder="Password">
                </div>
            </div>
            <div class="panel-section">
                <h3>Network</h3>
                <div class="config-field">
                    <label>WebSocket URL</label>
                    <input type="text" id="net-url" value="ws://localhost:8765" placeholder="ws://host:port">
                </div>
                <div class="config-field">
                    <button id="net-btn">Connect</button>
                </div>
            </div>
        </div>

        <div class="terminal-panel">
            <h2>UART0 Console</h2>
            <div id="terminal-container"></div>
        </div>

        <div class="side-panel">
            <div class="panel-section">
                <h3>GPIO Output</h3>
                <div class="gpio-grid" id="gpio-grid"></div>
            </div>
            <div class="panel-section">
                <h3>Registers</h3>
                <table class="reg-table" id="reg-table"></table>
            </div>
            <div class="panel-section">
                <h3>Memory Inspector</h3>
                <div style="display:flex;gap:4px;margin-bottom:4px;">
                    <input type="text" id="mem-addr" placeholder="0x3FC80000"
                        style="flex:1;background:#0a0a1a;color:#e0e0e0;border:1px solid #333;padding:3px 6px;font-family:monospace;font-size:11px;border-radius:3px;">
                    <button id="mem-read-btn" style="font-size:11px;">Read</button>
                </div>
                <pre id="mem-display" style="font-size:10px;color:#4ecca3;line-height:1.4;max-height:200px;overflow-y:auto;"></pre>
            </div>
        </div>
    </div>

    <footer>
        ESP-EMU v0.39.0 | Emulates ESP32-C3/C6 (RV32IMAC) and ESP32-P4 (RV32IMAFC, dual-core)
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
